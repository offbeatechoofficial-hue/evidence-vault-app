<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence Vault - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-none d-md-block bg-secondary sidebar">
                <div class="sidebar-sticky">
                    <h5 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted">
                        <span>Evidence Vault</span>
                    </h5>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="/">
                                <i class="fas fa-tachometer-alt"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/vault">
                                <i class="fas fa-shield-alt"></i> Evidence Vault
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/logout">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Dashboard</h1>
                </div>

                <!-- Stats Cards -->
                <div class="row">
                    <div class="col-md-3">
                        <div class="card bg-primary text-white">
                            <div class="card-body">
                                <h5 class="card-title"><i class="fas fa-database"></i> Total Records</h5>
                                <h2>{{ total }}</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-danger text-white">
                            <div class="card-body">
                                <h5 class="card-title"><i class="fas fa-exclamation-triangle"></i> High Severity</h5>
                                <h2>{{ stats.get('High', 0) }}</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-warning text-white">
                            <div class="card-body">
                                <h5 class="card-title"><i class="fas fa-exclamation-circle"></i> Medium Severity</h5>
                                <h2>{{ stats.get('Medium', 0) }}</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-success text-white">
                            <div class="card-body">
                                <h5 class="card-title"><i class="fas fa-info-circle"></i> Low Severity</h5>
                                <h2>{{ stats.get('Low', 0) }}</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Detection Form -->
                <div class="row mt-4">
                    <div class="col-md-12">
                        <div class="card bg-secondary">
                            <div class="card-header">
                                <h5><i class="fas fa-search"></i> Cyberbullying Detection</h5>
                            </div>
                            <div class="card-body">
                                <form id="detectionForm">
                                    <div class="mb-3">
                                        <label for="message" class="form-label">Enter Message or Upload Image</label>
                                        <textarea class="form-control" id="message" rows="3" placeholder="Type a message to analyze..."></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <input class="form-control" type="file" id="fileInput" accept="image/*">
                                    </div>
                                    <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> Analyze</button>
                                </form>
                                <div id="result" class="mt-3" style="display: none;">
                                    <h6>Analysis Result:</h6>
                                    <p id="resultText"></p>
                                    <a id="downloadLink" href="#" class="btn btn-success btn-sm"><i class="fas fa-download"></i> Download PDF</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
